<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="color-scheme" content="light dark">
    <title>Connect to ChordPH</title>
    <style>
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100dvh;
        display: grid;
        place-items: center;
        padding: max(24px, env(safe-area-inset-top)) max(24px, env(safe-area-inset-right)) max(24px, env(safe-area-inset-bottom)) max(24px, env(safe-area-inset-left));
        background: #fff;
        color: #18181b;
        font-family: system-ui, sans-serif;
      }
      main { width: 100%; max-width: 360px; }
      h1 { font-size: 24px; }
      p { color: #52525b; line-height: 1.6; }
      a {
        display: inline-block;
        margin-top: 12px;
        border-radius: 999px;
        padding: 12px 24px;
        background: #ed1746;
        color: #fff;
        font-weight: 600;
        text-decoration: none;
      }
      a:hover { background: #c91039; }
      a:focus-visible { outline: 3px solid #18181b; outline-offset: 4px; }
      @media (prefers-color-scheme: dark) {
        body { background: #0d0d0e; color: #f4f4f5; }
        p { color: #a1a1aa; }
        a { background: #ed1746; color: #fff; }
        a:hover { background: #c91039; }
        a:focus-visible { outline-color: #f4f4f5; }
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Can't connect to ChordPH</h1>
      <p>Check your internet connection and try again. If you're connected, ChordPH may be temporarily unavailable.</p>
      <a href="https://chordph.vercel.app">Try again</a>
    </main>
  </body>
</html>
